# Netlify publishes this folder as it is: no build step.
[build]
  publish = "."

# The service worker and the page must always be checked for a newer copy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
