<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Pocket">
<meta name="author" content="Eduardo Cruz">
<meta name="copyright" content="© 2026 Eduardo Cruz. All rights reserved except as allowed by the PolyForm Noncommercial License 1.0.0.">
<title>Word Pocket</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28"><h1>Word Pocket</h1></div>
    <div class="top-r">
    <button class="streak" id="streak" hidden aria-label="Streak"><span>🔥</span><b id="streak-n">0</b></button>
    <button class="goal" id="goal" aria-label="Today's goal">
      <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="ring-bg"/><circle cx="18" cy="18" r="15" class="ring-fg" id="ring"/></svg>
      <b id="goal-num">0</b>
    </button>
    <button class="gear" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <main>
    <!-- Look up -->
    <section id="view-look" class="view">
      <button class="source" id="source"><span class="clap">&#127916;</span> <span id="source-name">What are you watching?</span></button>
      <form id="look" class="search" autocomplete="off">
        <input id="q" type="search" inputmode="search" placeholder="A word you heard…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button type="button" id="clear" class="clear" aria-label="Clear" hidden>×</button>
        <button type="button" id="mic" class="mic" aria-label="Say the word" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
      </form>
      <div id="sugs" class="sugs"></div>
      <div id="result"></div>
      <div id="recent"></div>
    </section>

    <!-- My words -->
    <section id="view-words" class="view" hidden>
      <div class="send-box" id="send-box"></div>
      <div class="mastery" id="mastery"></div>
      <input id="filter" class="filter" type="search" placeholder="Search your words" autocomplete="off" spellcheck="false">
      <div class="groupby"><button data-g="source" class="on">By movie or show</button><button data-g="day">By day</button></div>
      <div id="list"></div>
    </section>

    <!-- Practice -->
    <section id="view-practice" class="view" hidden>
      <div id="game"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-view="look" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Look up</button>
    <button data-view="words">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v17l-7-4-7 4z"/></svg>My words <i id="count"></i></button>
    <button data-view="practice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Practice <i id="due"></i></button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <input type="file" id="import-file" accept=".txt,.json,text/plain,application/json" hidden>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
